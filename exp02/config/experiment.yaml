# PA-VFANN-10 / EXP-02 frozen configuration.
# Base commit: 0145cca. This file is independent of config/experiment.yaml (EXP-01).
# All stochastic components derive from data.seed = 2026; the public entry is
# additionally pinned as a literal below and regenerated by:
#   int(np.random.Generator(np.random.PCG64(np.random.SeedSequence([2026, 0x4558503032]))).integers(0, 10000))

data:
  n_vectors: 10000
  dimension: 128
  distribution: standard_normal
  seed: 2026

query:
  n_queries: 200

graph:
  degree: 16
  add_reverse_edges: true
  exact_knn: true
  chunk_size: 500

search:
  top_k: 10
  budgets: [20, 50, 100, 200, 500, 1000]
  min_expansions_before_stop: 20
  bridge_r_values: [1, 2, 4]
  target_recall: 0.90
  # Fixed public entry: independent of query, policy and authorization labels.
  entry_node_id: 8817

policies:
  selectivities: [0.01, 0.05, 0.10, 0.30]
  types: [random, clustered]
  clustered_centers: 3
  clustered_sigma: 40.0

correlation:
  leakage_budgets: [100, 500]
  # (name, policy A distribution/selectivity, policy B distribution/selectivity)
  leakage_pairs:
    - [random_1_vs_30, random, 0.01, random, 0.30]
    - [clustered_1_vs_30, clustered, 0.01, clustered, 0.30]
    - [random10_vs_clustered10, random, 0.10, clustered, 0.10]

serialization:
  # Little-endian struct fields. ID: <I (4 B). Distance: <f (4 B).
  # Vector: dimension x <f (4 B each). No authorization bit is sent by server.
  id_bytes: 4
  distance_bytes: 4
  vector_component_bytes: 4
